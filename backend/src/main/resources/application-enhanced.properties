# ==================== 数据库配置 ====================
spring.datasource.url=jdbc:mysql://localhost:3306/kami?useSSL=true&requireSSL=true&verifyServerCertificate=true&useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=your_secure_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP 连接池优化
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# ==================== Redis 配置 ====================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=your_redis_password_here
spring.data.redis.database=0
spring.data.redis.timeout=10000
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=5
spring.data.redis.lettuce.pool.max-wait=-1ms

# ==================== JWT 配置 ====================
# 重要：生产环境必须修改为随机密钥（至少256位）
jwt.secret=CHANGE_THIS_TO_A_SECURE_RANDOM_KEY_MINIMUM_256_BITS_XXXXXXXXXXXXXXXXXXXXXXXXXXXX
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=604800000

# ==================== 邮件配置 ====================
spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=noreply@example.com
spring.mail.password=your_email_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==================== 安全配置 ====================
# AES加密主密钥（必须修改！用于API密钥加密）
security.encryption.master-key=CHANGE_THIS_TO_A_SECURE_RANDOM_AES_256_KEY_BASE64_ENCODED

# 限流配置
ratelimit.login.max-requests=5
ratelimit.login.window-seconds=60
ratelimit.api.max-requests=100
ratelimit.api.window-seconds=60
ratelimit.admin.max-requests=60
ratelimit.admin.window-seconds=60

# CORS配置
cors.allowed-origins=https://yourdomain.com,https://www.yourdomain.com
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# ==================== 文件上传配置 ====================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==================== 日志配置 ====================
logging.level.root=INFO
logging.level.org.xxg.backend=DEBUG
logging.level.org.springframework.security=DEBUG
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=30

# ==================== Actuator 配置 ====================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ==================== 应用配置 ====================
spring.application.name=xxgkami-enhanced
server.port=8080
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# ==================== Session 配置 ====================
spring.session.store-type=jdbc
spring.session.timeout=30m

# ==================== 异步配置 ====================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100

# ==================== 安全头配置 ====================
security.headers.content-security-policy=default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'
security.headers.x-frame-options=DENY
security.headers.x-content-type-options=nosniff
security.headers.x-xss-protection=1; mode=block
security.headers.strict-transport-security=max-age=31536000; includeSubDomains
